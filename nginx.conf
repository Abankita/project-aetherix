server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # GeoJSON and Static Data Caching
    location /api/ {
        proxy_pass http://geospatial-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=60" always;
    }

    location = /healthz-api {
        proxy_pass http://geospatial-api:8000/healthz;
    }

    location /data/ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Static Assets Caching (Vite hash files)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA Routing Fallback (Direct URL navigation for all 5 dashboard routes)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom 404 handled by SPA
    error_page 404 /index.html;

    # Healthcheck endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
