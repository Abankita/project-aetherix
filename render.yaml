services:
  - type: web
    name: aetherix-geospatial-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATA_ROOT
        value: /data
      - key: CORS_ORIGINS
        value: https://project-aetherix.vercel.app,http://localhost:5173,http://localhost:8080
